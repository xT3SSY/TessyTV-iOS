name: TessyTV
options:
  bundleIdPrefix: com.mattia.tessytv
  deploymentTarget:
    iOS: "16.0"
packages:
  vlckit-spm:
    url: https://github.com/tylerjonesio/vlckit-spm.git
    from: 3.6.0
targets:
  TessyTV:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: vlckit-spm
        product: VLCKitSPM
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: TessyTV
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattia.tessytv.ios
        PRODUCT_NAME: TessyTV
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "5"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
