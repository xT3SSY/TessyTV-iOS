<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>TessyTV — Telecomando iPhone</title>
    <style>
        body { background: #0a0c12; color: #fff; font-family: -apple-system, sans-serif; padding: 20px; margin: 0; }
        .card { background: rgba(28,32,44,0.9); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 18px; margin-bottom: 16px; }
        h2 { color: #f5a640; margin: 0 0 12px 0; font-size: 18px; }
        input { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 12px; border: 1px solid #444; background: #111; color: #fff; font-size: 16px; margin-bottom: 10px; }
        button { width: 100%; padding: 13px; border-radius: 12px; border: none; background: #f5a640; color: #111; font-weight: 700; font-size: 16px; }
        #msg { text-align: center; color: #4ade80; font-size: 14px; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Invia Link M3U alla TV</h2>
        <input id="m3u" type="url" placeholder="Incolla qui URL M3U...">
        <button onclick="sendCmd('url', document.getElementById('m3u').value)">Invia e Carica su TV</button>
    </div>
    <div class="card">
        <h2>Invia Login Xtream Codes</h2>
        <input id="host" type="url" placeholder="Server URL (es. http://dominio:8080)">
        <input id="user" type="text" placeholder="Username">
        <input id="pass" type="password" placeholder="Password">
        <button onclick="sendXtream()">Invia Xtream alla TV</button>
    </div>
    <div class="card">
        <h2>Cerca Canale o Film sulla TV</h2>
        <input id="q" type="text" placeholder="Scrivi nome canale o film..." oninput="sendCmd('search', this.value)">
    </div>
    <div id="msg"></div>
    <script>
        const code = new URLSearchParams(location.search).get("code") || "";
        async function sendCmd(type, value) {
            if (!code || !value.trim()) return;
            await fetch("https://ntfy.sh/tessytv_pair_" + code, {
                method: "POST",
                body: JSON.stringify({ type, value: value.trim() })
            });
            document.getElementById("msg").textContent = "Inviato alla TV ✓";
        }
        function sendXtream() {
            const h = document.getElementById("host").value.trim().replace(/\/+$/, "");
            const u = encodeURIComponent(document.getElementById("user").value.trim());
            const p = encodeURIComponent(document.getElementById("pass").value.trim());
            if (h && u && p) sendCmd("url", `${h}/get.php?username=${u}&password=${p}&type=m3u_plus&output=ts`);
        }
    </script>
</body>
</html>
