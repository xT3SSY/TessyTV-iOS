name: Build TessyTV iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate
          xcodebuild -resolvePackageDependencies -project TessyTV.xcodeproj -scheme TessyTV

      - name: Build Unsigned IPA
        run: |
          xcodebuild -project TessyTV.xcodeproj \
            -scheme TessyTV \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            BUILD_DIR=build clean build

          rm -rf build/Release-iphoneos/TessyTV.app/_CodeSignature
          plutil -convert xml1 build/Release-iphoneos/TessyTV.app/Info.plist
          mkdir -p Payload
          cp -r build/Release-iphoneos/TessyTV.app Payload/
          zip -qry TessyTV.ipa Payload

      - name: Upload TessyTV.ipa
        uses: actions/upload-artifact@v4
        with:
          name: TessyTV-iOS-IPA
          path: TessyTV.ipa


